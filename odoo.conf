[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = dealflow360
; dbfilter MUST resolve to exactly one database. It used to be `.*` so that the
; per-agent databases (df_kevin, df_pam, df_atlas, df_test_*) were reachable
; from the web client. That phase is over, and the permissive filter was
; actively breaking the product: 19 databases matched, so Odoo could not pick
; one, /web/login 303'd to /web/database/selector on every visit, and the
; session's database stayed ambiguous. A refresh could re-resolve the browser
; onto a DIFFERENT database, where the same uid is a different person - which
; is the "accounts get swapped when the page is refreshed" bug. It also
; published every database name to anonymous callers via /web/database/list.
;
; Anchored, so only the demo database is servable over HTTP. Running tests on
; a scratch database still works - dbfilter only gates HTTP routing, and the
; CLI can override it anyway: `odoo -d df_test_x --db-filter='.*' ...`.
dbfilter = ^dealflow360$
; No reason to expose (or offer to create/drop/restore) databases from the
; login screen of a demo the customer logs into.
list_db = False
without_demo = all
