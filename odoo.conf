[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = dealflow360
; dbfilter must stay permissive: with db_name set and no dbfilter, Odoo treats
; db_name as an implicit filter, so /web/database/list returns only dealflow360
; and /web/login?db=<other> SILENTLY falls through to it instead of erroring.
; That made per-agent databases (df_kevin, df_pam, df_darryl) unreachable from
; the web client even though they exist in postgres, and sent agents onto the
; shared database by accident. Concurrent agents each need their own database.
dbfilter = .*
without_demo = all
